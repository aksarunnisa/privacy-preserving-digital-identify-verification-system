<!DOCTYPE html>
<html>
<head>
    <title>Identity Verification</title>
</head>
<body style="text-align:center; font-family:Arial;">

<h1>Privacy Preserving Identity Verification</h1>

<p>Enter your ID:</p>
<input type="text" id="userId" placeholder="Enter ID">

<br><br>

<button onclick="verifyUser()">Verify</button>

<h2 id="result"></h2>

<script>
function verifyUser() {
    let id = document.getElementById("userId").value;

    if(id === "1234") {
        document.getElementById("result").innerText = "✅ Verified";
    } else {
        document.getElementById("result").innerText = "❌ Not Verified";
    }
}
</script>

</body>
</html>
